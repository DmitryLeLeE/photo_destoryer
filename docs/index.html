<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHOTO DESTROYER - turn the past into ruins</title>
<meta name="description" content="Turn photos into old, broken, shredded and digitally destroyed ones. Runs entirely in your browser.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PHOTO DESTROYER</h1><span class="tag">// turn the past into ruins</span>
  <span class="spacer"></span>
  <button id="btnOpen">Open photo</button>
  <button id="btnStrip" disabled>Decay strip</button>
  <button id="btnSave" class="acc" disabled>Save PNG</button>
  <input id="file" type="file" accept="image/*" hidden>
</header>
<main>
  <div id="stage">
    <canvas id="view" width="2" height="2" hidden></canvas>
    <div id="drop"><b>Drop a photo here</b><span>or click "Open photo" / paste from clipboard</span><span>everything runs in your browser, nothing is uploaded</span></div>
    <div id="badge">ORIGINAL</div><div id="busy">rendering...</div>
  </div>
  <aside>
    <div class="top">
      <div class="lbl">MODE</div>
      <div class="modes" id="modes">
        <button data-mode="aging" data-preset="Forgotten album" data-group="TIME">AGING</button>
        <button data-mode="shred" data-preset="Shredder: strip cut" data-group="SHREDDER">SHREDDER</button>
        <button data-mode="digital" data-preset="Digital kill" data-group="DIGITAL KILL">DIGITAL KILL</button>
      </div>
      <div class="lbl">PRESET</div>
      <select id="preset"></select>
      <div class="row"><button id="btnRand">Randomize</button><button id="btnSeed">Re-roll seed</button></div>
      <div class="lbl">SEED <b id="seedv" style="color:var(--fg)">1</b> &nbsp; &nbsp; HOLD <b style="color:var(--fg)">SPACE</b> TO SEE THE ORIGINAL</div>
    </div>
    <div id="sliders"></div>
  </aside>
</main>
<footer><span id="status">Open a photo to begin</span>
  <select id="exportSize" style="width:auto" title="Export size"><option value="1600">1600 px</option><option value="2400" selected>2400 px</option><option value="3600">3600 px</option><option value="0">Original</option></select>
  <a href="https://github.com/DmitryLeLeE/photo_destoryer" target="_blank" rel="noopener">GitHub</a></footer>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
