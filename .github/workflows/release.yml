name: Release

# A release is published automatically when `__version__` in destroyer/__init__.py changes on main
# (the tag vX.Y.Z is created for you). The release text comes from RELEASE_NOTES.md.
# Manual run: Actions > Release > Run workflow (tick "publish" to also create the release).
on:
  push:
    branches: [main]
    paths: ["destroyer/__init__.py"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name PhotoDestroyer
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --collect-submodules PIL
          app.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PhotoDestroyer -DestinationPath PhotoDestroyer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDestroyer-windows
          path: PhotoDestroyer-windows.zip

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhotoDestroyer-windows
      - name: Publish
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('destroyer/__init__.py').read()).group(1))")
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists, nothing to do."; exit 0; fi
          TITLE=$(head -n1 RELEASE_NOTES.md | sed 's/^# *//')
          gh release create "$TAG" PhotoDestroyer-windows.zip --target "$GITHUB_SHA" --title "$TITLE" --notes-file RELEASE_NOTES.md
          echo "Published $TAG"
