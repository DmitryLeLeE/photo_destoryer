name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name PhotoDestroyer
          --icon icon.ico
          --add-data "icon.ico;."
          --add-data "icon.png;."
          --collect-submodules PIL
          app.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PhotoDestroyer -DestinationPath PhotoDestroyer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDestroyer-windows
          path: PhotoDestroyer-windows.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhotoDestroyer-windows.zip
          generate_release_notes: true
